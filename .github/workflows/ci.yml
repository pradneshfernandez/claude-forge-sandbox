name: CI
on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs elevate only what they need
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with: { fetch-depth: 0 }
      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
      - name: Semgrep (SAST)
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/default

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
      - name: Dependency review (vuln + license gate)
        uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9 # v4
        with:
          fail-on-severity: high

  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
      # Toolchain per SPEC.md §Toolchain / ADR-001: Python 3 stdlib only.
      # ubuntu-latest ships python3 >= 3.12 — no setup action, nothing new to pin.
      - name: Lint (byte-compile)
        run: python3 -m compileall -q examples/todo-cli framework/scripts
      - name: Unit tests (todo-cli)
        run: cd examples/todo-cli && python3 -m unittest discover -s tests -t . -v
      - name: STATE.md drift check
        run: python3 .claude/scripts/forge-state.py --check
